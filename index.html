<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tall Pine Thursday 🍻</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; /* Changed back to fixed height to ensure centering */
            font-family: 'Arial Black', sans-serif; 
            margin: 0;
            overflow: hidden;
            transition: background-color 0.2s;
            text-align: center;
        }

        #timer { font-size: clamp(2rem, 15vw, 8rem); transition: all 0.5s; }
        #targetDate { font-size: clamp(1rem, 4vw, 1.6rem); color: #aaa; margin-top: 8px; font-family: Arial, sans-serif; }
        #special { font-size: clamp(1rem, 4.5vw, 1.8rem); color: #ffcc66; margin-top: 14px; max-width: 90vw; }
        #message { font-size: clamp(2rem, 10vw, 4rem); text-transform: uppercase; margin-bottom: 20px; }
        #kenoLabel { font-size: 1.2rem; color: #aaa; margin-top: 10px; font-family: Arial, sans-serif; font-style: italic; }
        
        #audioToggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #fff;
            color: #fff;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 100;
        }

        #hornBtn {
            margin-top: 25px;
            background: #c00;
            border: 3px solid #fff;
            color: #fff;
            padding: 18px 36px;
            cursor: pointer;
            border-radius: 12px;
            font-family: 'Arial Black', sans-serif;
            font-size: clamp(1.2rem, 6vw, 2rem);
            text-transform: uppercase;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.7);
            animation: hornpulse 0.8s infinite;
            z-index: 50;
        }
        @keyframes hornpulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Fixed Footer Styles to prevent breaking layout */
        #footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            pointer-events: none; /* Allows clicking through if needed */
        }
        #footer > * { pointer-events: auto; }
        #shane-text { font-size: 2rem; font-weight: 900; margin-bottom: 5px; }
        #logo img { width: 100px; border-radius: 50%; border: 2px solid #555; }
        #counter { font-size: 0.8rem; color: #666; }
        #built-by { font-size: 0.85rem; color: #888; font-family: Arial, sans-serif; margin-top: 4px; }
        #built-by a { color: #aaa; text-decoration: none; }
        #built-by a:hover { color: #fff; text-decoration: underline; }

        #keno { 
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .ball {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 20px 20px, #ffffff, #999);
            color: #000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 20pt;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.6);
            border: 2px solid #666;
            position: relative;
            overflow: hidden;
            animation: vibrate 0.2s infinite;
        }

        .ball::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 60%, rgba(255,255,255,0) 100%);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        @keyframes vibrate {
            0% { transform: translate(0,0); }
            25% { transform: translate(1px, -1px); }
            50% { transform: translate(-1px, 1px); }
            75% { transform: translate(1px, 1px); }
            100% { transform: translate(0,0); }
        }

        @keyframes pulse {
            0% { background-color: #000; }
            50% { background-color: #600; }
            100% { background-color: #000; }
        }
        .warning-mode { animation: pulse 1.5s infinite; }
    </style>
</head>
<body>
    <button id="audioToggle">🔇</button>
    <audio id="bgMusic" src="party-theme.mp3" loop></audio>
    <audio id="hornAudio" src="airhorn.mp3" preload="auto"></audio>

    <div id="timer">Loading...</div>
    <div id="targetDate"></div>
    <div id="special"></div>
    <div id="message"></div>
    <div id="kenoLabel"></div>
    <div id="keno"></div>
    <button id="hornBtn" style="display:none">📯 Air Horn</button>

    <div id="footer">
        <div id="shane-text">Hey Hey Hey Shane is not Gay</div>
        <a href="https://Tallpinelounge.com" id="logo"><img src="chip2.png" alt="Tall Pine Logo"></a>
        <div id="counter">Hits: <span id="hitCount">0</span></div>
        <div id="built-by">Built by Vern · <a href="tel:+14064206839">(406) 420-6839</a> · <a href="mailto:BigforkVern@gmail.com">BigforkVern@gmail.com</a></div>
    </div>

    <script>
        // ---- Weekly Wednesday Asian special. Vern updates this after the Wednesday check. ----
        const WEDNESDAY_SPECIAL = "This week's Asian special: TBD — check back Wednesday";

        let hits = localStorage.getItem('page_hits') || 0;
        hits++;
        localStorage.setItem('page_hits', hits);
        document.getElementById('hitCount').innerText = hits;

        let confettiInterval;
        let testMode = false;
        const audio = document.getElementById('bgMusic');
        const audioBtn = document.getElementById('audioToggle');
        const hornAudio = document.getElementById('hornAudio');
        const hornBtn = document.getElementById('hornBtn');

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 't') {
                testMode = !testMode;
                if (!testMode) location.reload();
            }
        });

        audioBtn.addEventListener('click', () => {
            if (audio.muted) {
                audio.muted = false;
                audioBtn.innerHTML = "🔊";
            } else {
                audio.muted = true;
                audioBtn.innerHTML = "🔇";
                audio.pause();
            }
        });

        hornBtn.addEventListener('click', () => {
            hornAudio.currentTime = 0;
            hornAudio.play().catch(e => {});
        });

        audio.muted = true;

        function getKenoNumbers(seedDate) {
            const dateString = seedDate.getFullYear() + "-" + seedDate.getMonth() + "-" + seedDate.getDate();
            let seed = 0;
            for (let i = 0; i < dateString.length; i++) {
                seed += dateString.charCodeAt(i);
            }
            let currentSeed = seed;
            const numbers = [];
            while (numbers.length < 6) { 
                currentSeed = (currentSeed * 9301 + 49297) % 233280;
                const num = Math.floor((currentSeed / 233280) * 80) + 1;
                if (!numbers.includes(num)) numbers.push(num);
            }
            return numbers.sort((a, b) => a - b);
        }

        function update() {
            const now = new Date();
            let target = new Date();
            target.setDate(now.getDate() + (4 - now.getDay() + 7) % 7);
            target.setHours(19, 30, 0, 0);

            const twoHoursAfter = new Date(target.getTime() + (2 * 60 * 60 * 1000));
            if (now > twoHoursAfter) target.setDate(target.getDate() + 7);

            const diff = target - now;
            const secondsTotal = Math.floor(diff / 1000);
            
            const body = document.body;
            const timerDiv = document.getElementById('timer');
            const dateDiv = document.getElementById('targetDate');
            const specialDiv = document.getElementById('special');
            const msgDiv = document.getElementById('message');
            const kenoLabel = document.getElementById('kenoLabel');
            const kenoDiv = document.getElementById('keno');

            if ((now >= target && now <= twoHoursAfter) || testMode) {
                timerDiv.style.display = "none";
                dateDiv.style.display = "none";
                specialDiv.style.display = "none";
                hornBtn.style.display = "block";
                body.classList.remove('warning-mode');
                msgDiv.innerHTML = "DRINKY TIME";
                kenoLabel.innerHTML = "tonight's lucky numbers";
                
                if (kenoDiv.innerHTML === "") {
                    const nums = getKenoNumbers(target);
                    kenoDiv.innerHTML = nums.map(n => `<div class="ball">${n}</div>`).join('');
                }
                
                body.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 20%)`;
                
                if (!audio.muted && audio.paused) {
                    audio.play().catch(e => {});
                }

                if (!confettiInterval) {
                    confettiInterval = setInterval(() => {
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    }, 2000);
                }
                return;
            }

            clearInterval(confettiInterval);
            confettiInterval = null;
            hornBtn.style.display = "none";
            timerDiv.style.display = "block";
            dateDiv.style.display = "block";
            specialDiv.style.display = "block";
            msgDiv.innerHTML = "";
            kenoLabel.innerHTML = "";
            kenoDiv.innerHTML = "";
            body.style.backgroundColor = "#000";
            if (!audio.paused && !testMode) audio.pause();

            dateDiv.innerHTML = target.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            specialDiv.innerHTML = WEDNESDAY_SPECIAL;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / 1000 / 60) % 60);
            const secs = Math.floor((diff / 1000) % 60);
            timerDiv.innerHTML = `${days}d ${hours}h ${mins}m ${secs}s`;

            if (secondsTotal <= 600 && secondsTotal > 0) {
                body.classList.add('warning-mode');
                msgDiv.innerHTML = "GET YOUR SHOES ON";
            } else if (secondsTotal <= 3600 && secondsTotal > 600) {
                body.classList.remove('warning-mode');
                msgDiv.innerHTML = "ONE HOUR &mdash; START HYDRATING";
            } else if (secondsTotal <= 7200 && secondsTotal > 3600) {
                body.classList.remove('warning-mode');
                msgDiv.innerHTML = "SOON.....";
            } else {
                body.classList.remove('warning-mode');
            }
        }

        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
